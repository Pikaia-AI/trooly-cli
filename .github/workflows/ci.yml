name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: node dist/index.js --help
      - run: node dist/index.js guide
      - name: Verify package contents
        shell: bash
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/trooly-pack.json"
          node --input-type=module -e 'import fs from "node:fs"; const files = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))[0].files; if (files.some(({path}) => !path.startsWith("dist/") && !["README.md", "LICENSE", "package.json"].includes(path))) process.exit(1);' "$RUNNER_TEMP/trooly-pack.json"
