name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - name: Verify tag and select distribution channel
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${pkg.version}`) throw new Error('Tag must match package.json version');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `channel=${pkg.version.includes('-') ? 'next' : 'latest'}\n`);
          NODE
      - run: npm pack --dry-run
      - run: npm publish --access public --tag ${{ steps.version.outputs.channel }}
